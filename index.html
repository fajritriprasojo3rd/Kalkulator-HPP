<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Ayam - Auto Save</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card-title { color: #818cf8; font-size: 16px; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .card-title::before { content: ''; display: inline-block; width: 10px; height: 10px; background-color: #818cf8; border-radius: 50%; }
        .subtitle { font-size: 12px; color: #94a3b8; margin-bottom: 15px; line-height: 1.4; }
        .baris-modal { background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
        input, select { background-color: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; padding: 12px; font-size: 14px; width: 100%; box-sizing: border-box; }
        input:focus, select:focus { border-color: #818cf8; outline: none; }
        .btn-tambah { background-color: #312e81; color: #a5b4fc; border: none; padding: 12px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; margin-top: 5px; width: 100%; transition: 0.2s; }
        .btn-tambah:hover { background-color: #3730a3; }
        .row-stat { display: flex; align-items: center; gap: 15px; margin-bottom: 12px; }
        .row-stat label { flex: 1; font-weight: bold; font-size: 14px; }
        .row-stat input { width: 100px; text-align: center; }
        .btn-hapus { background-color: #7f1d1d; color: #fca5a5; border: none; border-radius: 6px; padding: 8px; cursor: pointer; align-self: flex-end; font-size: 12px; font-weight: bold; transition: 0.2s; }
        .btn-hapus:hover { background-color: #991b1b; }
        #status-save { font-size: 12px; color: #94a3b8; text-align: right; margin-bottom: 10px; height: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div id="status-save"></div>
    <div class="card">
        <div class="card-title">1. Modal Ayam & Bumbu</div>
        <div class="subtitle">Pilih bahan yang dipakai (Ayam, Beras, Bumbu, Gas).</div>
        <div id="container-modal"></div>
        <button type="button" id="btn-tambah" class="btn-tambah">+ Tambah Modal</button>
    </div>
    <div class="card">
        <div class="card-title">2. Hasil Potongan (Jualan)</div>
        <div class="subtitle">1 Ekor Ayam jadi berapa? (Misal: Daging 10, Jeroan 1, Kepala 1).</div>
        <div class="row-stat">
            <label>Daging</label>
            <input type="number" id="input-daging" value="10">
        </div>
        <div class="row-stat">
            <label>Jeroan</label>
            <input type="number" id="input-jeroan" value="1">
        </div>
    </div>
</div>

<!-- Panggil script.js di paling bawah -->
<script src="script.js" defer></script>

</body>
</html>
